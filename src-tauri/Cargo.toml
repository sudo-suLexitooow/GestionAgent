[package]
name = "cadre"
version = "0.0.0"
description = "Cadre — conception et surveillance du cadrage des agents IA"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cadre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
# Moteur simulé (`tauri::test`) pour tester les commandes sans fenêtre réelle.
tauri = { version = "2", features = ["test"] }
