[package]
name = "cadre"
version = "0.0.0"
description = "Cadre — conception et surveillance du cadrage des agents IA"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cadre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
humantime = "2"

[dev-dependencies]
tempfile = "3"
